# pyproject.toml — Plan Console dev/test toolchain.
# The application itself has ZERO runtime dependencies (pure stdlib);
# this file exists only to pin the test tooling and provide a
# `pytest` entry point.

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-console"
version = "3.13"
description = "Paste-to-plan intake + session lifecycle manager"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Costel Iordan", email = "costel.iordan@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest >= 7.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.setuptools]
py-modules = ["plan-console"]
